[project]
name = "course-builder"
version = "0.1.0"
description = "Build course website and materials"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "babel>=2.18.0",
    "pyyaml>=5.1",
    "watchdog>=6.0.0",
]

[project.scripts]
course = "tooling:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["tooling"]
# Ship the template, assets and the `course init` skeleton (incl. dotfiles) as
# package data so they are found relative to the installed package.
artifacts = [
    "tooling/templates/**",
    "tooling/assets/**",
    "tooling/skeleton/**",
]
